<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Chapter 0</title>
  <style>
    :root {
      --bg-color: #FBFBF9;
      --border-color: #E7E5DF;
      --accent-color: #BC4F26;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #141312;
        --border-color: #2D2A27;
        --accent-color: #E07A52;
      }
    }
  </style>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="var(--bg-color, #FBFBF9)" stroke="var(--border-color, #E7E5DF)" stroke-width="4" />

  <!-- Full-sized Slashed 0 (maintaining safe zone) -->
  <g fill="none" stroke="var(--accent-color, #BC4F26)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="150" y="80" width="212" height="352" rx="106" stroke-width="44" />
    <line x1="316" y1="140" x2="196" y2="372" stroke-width="28" />
  </g>
</svg>
