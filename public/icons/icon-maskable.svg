             C 328 120, 396 134, 428 152 
             C 436 157, 440 165, 440 174 
             L 440 344 
             C 440 352, 434 358, 426 354 
             C 396 338, 328 346, 256 374" 
          stroke-width="17" />

    <!-- Slashed Stadium 0 -->
    <rect x="222" y="197" width="68" height="126" rx="34" stroke-width="17" />
    <line x1="280" y1="220" x2="232" y2="300" stroke-width="15" />
