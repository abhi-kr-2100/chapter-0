[test]
coverage = true
coveragePathIgnorePatterns = [
  "tests/**",
  "src/lib/sw/lifecycle.ts",
  "src/lib/sw/use-service-worker.ts",
  "src/app/sw-register.tsx",
]
coverageSkipTestFiles = true
coverageThreshold = 1.0
pathIgnorePatterns = ["tests/e2e/**"]
preload = ["./tests/unit-tests-setup.ts"]
randomize = true
onlyFailures = true
